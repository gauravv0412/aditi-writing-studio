# Render Blueprint — deploy free in a few clicks.
# 1. Push this folder to a GitHub repo.
# 2. On render.com: New +  ->  Blueprint  ->  pick the repo.
# 3. Set ANTHROPIC_API_KEY (and optionally APP_PASSWORD) when prompted. Deploy.
services:
  - type: web
    name: writing-studio
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false        # paste your key in the Render dashboard
      - key: APP_PASSWORD
        sync: false        # a password to open the app (recommended when hosted)
      - key: MODEL
        value: claude-opus-4-8
